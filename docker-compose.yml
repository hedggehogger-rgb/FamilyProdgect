version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: family_finance_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family_finance_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Внутри сети Docker адрес базы — это имя сервиса 'postgres'
      - DB_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_ENV=development
    volumes:
      # Hot-reload для бэкенда при изменении кода
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: family_finance_ui
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      # Прокси в Vite перенаправляет запросы на сервис 'backend' внутри сети Docker
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      # Hot-reload для фронтенда при изменении Vue файлов
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata: